# main 브랜치에 push 하면 Firebase(보안 규칙 + 사이트)에 자동 배포됩니다.
# 사전 설정(GitHub 저장소 Settings > Secrets and variables > Actions):
#   Secret  FIREBASE_SERVICE_ACCOUNT : Firebase 서비스 계정 키(JSON 전체)
#   Variable FIREBASE_PROJECT_ID     : Firebase 프로젝트 ID
name: Deploy to Firebase
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g firebase-tools
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only firestore:rules,hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
